# =====================================================================
# Example application consuming the norskel auth-module extension.
# =====================================================================

# === API keys: signing (this app mints them) + verification ===
# DEV-ONLY KEYPAIR, committed so the example runs out of the box.
# In production mount the private key from a secret (Vault, K8s secret,
# env var) and never package it in the jar.
smallrye.jwt.sign.key.location=dev-only-private-key.pem
mp.jwt.verify.publickey.location=dev-only-public-key.pem

# The extension defaults mp.jwt.verify.issuer to its own build-time value
# (norskel-auth). Pinned explicitly here because in dev/test mode
# smallrye-jwt would otherwise default it to https://quarkus.io/issuer.
mp.jwt.verify.issuer=norskel-auth

# Keys created without an explicit lifetime get this TTL.
norskel-auth.api-token.default-ttl=P30D

# === OIDC ===
# Applies to every profile.
quarkus.oidc.application-type=service
# Required: OIDCSecurityIdentitySupplier reads the userinfo attribute and fails
# authentication outright when it is absent.
quarkus.oidc.authentication.user-info-required=true

# --- dev & test ---
# quarkus.oidc.auth-server-url is deliberately NOT set here. Quarkus starts
# Dev Services for Keycloak only when that property is absent, so leaving it
# out gives `quarkus:dev` and the test suite a real Keycloak container
# (realm "quarkus", users alice/bob) with discovery enabled. Setting it — as
# earlier versions of this file did — silently disables Dev Services, which
# looks like Dev Services being broken.
#
# Requires a running Docker/Podman; see example-app/README.md.

# --- prod ---
# The packaged jar has no Dev Services, so it needs somewhere to point. These
# are unreachable placeholders that let `java -jar` boot with no identity
# provider running: discovery is off and nothing is contacted until an
# "Authorization: Bearer" token actually arrives. Replace with a real IDP and
# drop the *-path lines to use discovery instead.
%prod.quarkus.oidc.auth-server-url=http://localhost:8180/realms/demo
%prod.quarkus.oidc.discovery-enabled=false
%prod.quarkus.oidc.client-id=demo-client
%prod.quarkus.oidc.jwks-path=protocol/openid-connect/certs
%prod.quarkus.oidc.token-path=protocol/openid-connect/token
%prod.quarkus.oidc.introspection-path=protocol/openid-connect/token/introspect

#norskel-auth.user.roles-claim=groups
#norskel-auth.user.grant-sso-roles=true
#norskel-auth.user.db-role-from-sso=admin,manager
#norskel-auth.user.default-role=user_norskl

# With discovery disabled, requiring userinfo also means declaring where it
# lives. Omitting this fails startup with "UserInfo is required but
# 'quarkus.oidc.user-info-path' is not configured."
%prod.quarkus.oidc.user-info-path=protocol/openid-connect/userinfo

# Seeds a demo admin + service key at startup and logs their tokens.
# Ignored outside dev/test mode; see ExampleBootstrap.
example.seed.enabled=true
