# === API keys (signing + verification) ===
mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
# Pinned explicitly: in dev/test mode smallrye-jwt dev-services would otherwise
# default the verify issuer to https://quarkus.io/issuer. In production the
# extension's own default (norskel-auth, from norskel-auth-build.api-token-issuer)
# applies, matching what ApiKeyService signs with.
mp.jwt.verify.issuer=norskel-auth

# === OIDC kept on the classpath so we verify API-key dispatch coexists with it ===
# Discovery disabled + dummy endpoints => no network call at boot; OIDC only reaches
# out when an Authorization: Bearer token is presented (this test only uses X-Api-Key).
quarkus.oidc.auth-server-url=http://localhost:8180/realms/test
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=protocol/openid-connect/certs
quarkus.oidc.token-path=protocol/openid-connect/token
quarkus.oidc.introspection-path=protocol/openid-connect/token/introspect
quarkus.oidc.client-id=test-client
quarkus.oidc.application-type=service
